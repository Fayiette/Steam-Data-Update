name: Fetch Steam Activity Data

on:
  schedule:
    # Every 2 hours at :00 UTC (GitHub cron; delays possible during high load).
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    # All config below is read from Secrets on Environment "prod" (Settings → Environments → prod → Environment secrets).
    environment: prod

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install system deps
      run: |
        sudo apt-get update -y
        sudo apt-get install -y jq curl

    - name: Run Steam activity fetch script
      env:
        ACTIVITY_CSV_NAME: ${{ secrets.ACTIVITY_CSV_NAME }}
        GENRE_CACHE_NAME: ${{ secrets.GENRE_CACHE_NAME }}
        STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        STEAM_ID64: ${{ secrets.STEAM_ID64 }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      run: python steam_activity_github.py

    - name: Error notification
      if: failure()
      uses: actions/github-script@v7
      with:
        script: console.log('Workflow failed - check logs');
